# Publication de la page de statut de Lucerna (#493) sur GitHub Pages.
# Déclenchée à chaque modification poussée sur main (statut.json modifié depuis l'app GitHub mobile,
# ou par `node scripts/statut.mjs … --appliquer`), et à la main (onglet Actions › Run workflow).
# Aucune dépendance : Node seul, aucun secret. Ce fichier n'agit que dans le dépôt lucerna-statut.
name: Page de statut

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; la plus récente gagne (statut le plus frais).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Vérifier statut.json et le script
        run: |
          node scripts/statut.mjs verifier
          node --test scripts/
      - name: Générer la page
        run: node scripts/statut.mjs construire
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
